name: Exact notebook toolchain
description: Install the pinned Node, Deno, Python and uv tools without cache writes.
runs:
  using: composite
  steps:
    - name: Read exact pins
      id: pins
      shell: bash
      run: |
        while read -r tool version compatibility; do
          test -n "$tool" && test -n "$version"
          printf '%s=%s\n' "$tool" "$version" >> "$GITHUB_OUTPUT"
        done < .tool-versions
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.pins.outputs.nodejs }}
        package-manager-cache: false
    - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      with:
        deno-version: ${{ steps.pins.outputs.deno }}
    - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
      with:
        python-version: ${{ steps.pins.outputs.python }}
    - uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
      with:
        version: ${{ steps.pins.outputs.uv }}
        enable-cache: false
    - name: Refuse differing tools and install frozen dependencies
      shell: bash
      run: |
        test "$(node --version)" = "v${{ steps.pins.outputs.nodejs }}"
        test "$(deno --version | head -n 1)" = "deno ${{ steps.pins.outputs.deno }}"
        test "$(python --version)" = "Python ${{ steps.pins.outputs.python }}"
        test "$(uv --version)" = "uv ${{ steps.pins.outputs.uv }}"
        manager="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')"
        case "$manager" in pnpm@[0-9]*.[0-9]*.[0-9]*) ;; *) exit 1 ;; esac
        corepack enable
        corepack prepare "$manager" --activate
        test "pnpm@$(pnpm --version)" = "$manager"
        pnpm install --frozen-lockfile
        uv sync --frozen
