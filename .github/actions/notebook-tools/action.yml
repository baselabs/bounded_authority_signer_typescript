name: Exact notebook toolchain
description: Install pinned Node, Deno, Python and uv tools and frozen dependencies without cache writes.
runs:
  using: composite
  steps:
    - name: Read exact tool pins
      id: pins
      shell: bash
      run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"
    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.pins.outputs.nodejs }}
        package-manager-cache: false
    - name: Refuse a different Node version
      shell: bash
      env:
        TOOLCHAIN_NODE_VERSION: ${{ steps.pins.outputs.nodejs }}
      run: scripts/toolchain.sh --installed "nodejs=$TOOLCHAIN_NODE_VERSION"
    - name: Set up Deno
      uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      with:
        deno-version: ${{ steps.pins.outputs.deno }}
    - name: Refuse a different Deno version
      shell: bash
      env:
        TOOLCHAIN_DENO_VERSION: ${{ steps.pins.outputs.deno }}
      run: scripts/toolchain.sh --installed "deno=$TOOLCHAIN_DENO_VERSION"
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ steps.pins.outputs.python }}
    - name: Refuse a different Python version
      shell: bash
      env:
        TOOLCHAIN_PYTHON_VERSION: ${{ steps.pins.outputs.python }}
      run: scripts/toolchain.sh --installed "python=$TOOLCHAIN_PYTHON_VERSION"
    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: ${{ steps.pins.outputs.uv }}
        enable-cache: false
        save-cache: false
    - name: Refuse a different uv version
      shell: bash
      env:
        TOOLCHAIN_UV_VERSION: ${{ steps.pins.outputs.uv }}
      run: scripts/toolchain.sh --installed "uv=$TOOLCHAIN_UV_VERSION"
    - name: Activate the declared package manager
      shell: bash
      run: |
        manager="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')"
        case "$manager" in pnpm@[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::Declare an exact pnpm packageManager"; exit 1 ;; esac
        corepack enable
        corepack prepare "$manager" --activate
        version="$(pnpm --version)"
        test "pnpm@$version" = "$manager"
    - name: Install JavaScript dependencies frozen
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Check the Python lock
      shell: bash
      run: uv lock --check
    - name: Install Python dependencies frozen
      shell: bash
      run: uv sync --frozen
