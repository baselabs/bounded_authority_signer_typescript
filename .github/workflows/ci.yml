name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: typecheck, build, unit, gates, oracle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Tri-platform bar (family standard, 2026-09-16): clone → build → test
        # must hold on macOS, Linux, and Windows. Every step is pnpm/Node —
        # no POSIX shell anywhere in the lane.
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.20.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Exact pin, lockstep with .tool-versions (engines stays the consumer
          # floor ">= 22"). The release lane stays on Node 24 — it needs the
          # npm >= 11.5 that trusted publishing requires.
          node-version: 22.23.1
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck (strict)
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit + gates + oracle (verifier-package cross-verification)
        run: pnpm test
