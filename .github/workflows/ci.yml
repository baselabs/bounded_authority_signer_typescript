name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, lint, browser guards, size, unit, gates, oracle, node lanes (both verifier backends) (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        # Two exact pins: 22.23.1 lockstep with .tool-versions (engines stays the
        # consumer floor ">= 22"), and 24.19.0 — the runtime line the release lane
        # uses. The strict self-verify runs on both, against both verifier backends
        # (node:crypto under default conditions, portable under bap-portable).
        node: [22.23.1, 24.19.0]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.20.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Exact pins from the matrix above. The release lane stays on Node 24 —
          # it needs the npm >= 11.5 that trusted publishing requires.
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck (strict)
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Browser typecheck (src/ and the browser lane pages, DOM + ES2022, no ambient types)
        run: pnpm typecheck:browser

      - name: Lint (browser-safety rules for src/)
        run: pnpm lint

      - name: Browser bundle guard (the verifier's portable backend only; no unresolved globals, eval or Function constructor)
        run: pnpm guard:browser

      - name: Browser bundle size within its limits (tools/bundle-size-limits.json)
        run: pnpm size

      - name: Unit + gates + oracle (verifier-package cross-verification)
        run: pnpm test

      - name: Unit + gates + oracle under the verifier's portable backend (--conditions=bap-portable)
        run: pnpm test:portable

      - name: Node lanes (sign then verify, low-S; the node and the portable verifier backends)
        env:
          BAP_RUNTIMES: node,node-portable
        run: pnpm test:runtimes

  runtimes:
    # Deno and Bun resolve the verifier's "#crypto" import under their own conditions (deno, bun) to its
    # portable backend; each lane asserts BACKEND_ID first, then signs and verifies v1, v2 and v3, and
    # runs the WebCrypto key-handle battery with the runtime's own non-extractable keys.
    name: sign-then-verify lane on ${{ matrix.runtime }}
    strategy:
      fail-fast: false
      matrix:
        runtime: [deno, bun]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.20.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1 # lockstep with .tool-versions (the family asdf pin)
          cache: pnpm

      - name: Set up Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.5.6

      - name: Set up Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Sign-then-verify lane
        env:
          BAP_RUNTIMES: ${{ matrix.runtime }}
        run: pnpm test:runtimes

  package:
    # The packed tarball as a consumer receives it: typecheck with skipLibCheck false under each
    # resolution, lib and condition set, the leaked-type red-proof, and the installed package run on
    # Node (both verifier backends), Deno and Bun, including the "./*" deep-import passthrough.
    name: packed tarball (consumer typecheck and runtimes)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.20.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1 # lockstep with .tool-versions (the family asdf pin)
          cache: pnpm

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.5.6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Packed tarball checks (builds first)
        run: pnpm test:tarball

  browser:
    # Real engines through Playwright under the strict CSP (an engine axis, not an OS axis: Linux only).
    # Each engine also runs the WebCrypto key-handle battery with its own keys (including a same-origin
    # iframe key) and the non-secure-context lane (http://bap.test routed by Playwright). Linux WebKit is
    # evidence for the pure-JS code and for that WebKit build's WebCrypto only, never for Safari.
    name: browser lane on ${{ matrix.engine }}
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.20.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1 # lockstep with .tool-versions (the family asdf pin)
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install the ${{ matrix.engine }} build pinned by the locked Playwright
        run: pnpm exec playwright install --with-deps ${{ matrix.engine }}

      - name: Browser lane
        env:
          BAP_BROWSERS: ${{ matrix.engine }}
        run: pnpm test:browser

  supply-chain:
    # Registry signatures and provenance attestations of every installed package (CI and release).
    name: npm audit signatures
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.20.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1 # lockstep with .tool-versions (the family asdf pin)
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Verify registry signatures and attestations
        run: npm audit signatures

  dependency-currency:
    # Latest-first dependency currency (BAP ADR 0032 shape). A property of the
    # manifest + lockfile, so it is proven once per run, not once per OS lane.
    name: dependency currency (latest-first)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.20.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1 # lockstep with .tool-versions (the family asdf pin)
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Dependency currency (classified exit; unverified never passes)
        run: node tools/check-currency.mjs
