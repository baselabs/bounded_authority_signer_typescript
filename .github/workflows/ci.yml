name: CI

on:
  push:
    branches: ['kci/**']

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    timeout-minutes: 5 # Run 44312139445: slowest green lane 72s.
    name: typecheck, lint, browser guards, size, unit, gates, oracle, node lanes (both verifier backends) (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        # The two exact Node pins on the .tool-versions nodejs line, read by
        # scripts/tool-versions.sh: the primary version and the compatibility lane
        # (engines stays the consumer floor ">= 22").
        # The strict self-verify runs on both, against both verifier backends
        # (node:crypto under default conditions, portable under bap-portable).
        node: [nodejs, nodejs-next]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read exact runtime pins
        id: pins
        shell: bash
        run: scripts/tool-versions.sh read nodejs

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Both supported lanes are pinned in .tool-versions.
          node-version: ${{ steps.pins.outputs[matrix.node] }}
          package-manager-cache: false
      - name: Activate the declared pnpm with Corepack
        run: |
          manager="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')"
          case "$manager" in pnpm@[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::Declare an exact pnpm packageManager"; exit 1 ;; esac
          corepack enable
          corepack prepare "$manager" --activate
          version="$(pnpm --version)"
          test "pnpm@$version" = "$manager"
      - name: Refuse a different Node version
        env:
          NODE_LANE: ${{ matrix.node == 'nodejs-next' && 'next' || 'primary' }}
        run: scripts/tool-versions.sh check nodejs "$NODE_LANE"

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Published dependency documentation checks (fail closed)
        run: pnpm test:network

      - name: Typecheck (strict)
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: API reference (all package export paths, warnings are errors)
        run: pnpm docs:api

      - name: Browser typecheck (src/ and the browser lane pages, DOM + ES2022, no ambient types)
        run: pnpm typecheck:browser

      - name: Lint (browser-safety rules for src/)
        run: pnpm lint

      - name: Browser bundle guard (the verifier's portable backend only; no unresolved globals, eval or Function constructor)
        run: pnpm guard:browser

      - name: Browser bundle size within its limits (tools/bundle-size-limits.json)
        run: pnpm size

      - name: Unit + gates + oracle (verifier-package cross-verification)
        run: pnpm test

      - name: Unit + gates + oracle under the verifier's portable backend (--conditions=bap-portable)
        run: pnpm test:portable

      - name: Node lanes (sign then verify, low-S; the node and the portable verifier backends)
        env:
          BAP_RUNTIMES: node,node-portable
        run: pnpm test:runtimes

  runtimes:
    timeout-minutes: 5 # Run 44122886989: slowest green lane 30s.
    # Deno and Bun resolve the verifier's "#crypto" import under their own conditions (deno, bun) to its
    # portable backend; each lane asserts BACKEND_ID first, then signs and verifies v1, v2 and v3, and
    # runs the WebCrypto key-handle battery with the runtime's own non-extractable keys.
    name: sign-then-verify lane on ${{ matrix.runtime }}
    strategy:
      fail-fast: false
      matrix:
        runtime: [deno, bun]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read exact runtime pins
        id: pins
        shell: bash
        run: scripts/tool-versions.sh read nodejs deno bun

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.nodejs }}
          package-manager-cache: false
      - name: Activate the declared pnpm with Corepack
        run: |
          manager="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')"
          case "$manager" in pnpm@[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::Declare an exact pnpm packageManager"; exit 1 ;; esac
          corepack enable
          corepack prepare "$manager" --activate
          version="$(pnpm --version)"
          test "pnpm@$version" = "$manager"
      - name: Refuse a different Node version
        run: scripts/tool-versions.sh check nodejs

      - name: Set up Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ steps.pins.outputs.deno }}

      - name: Set up Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.pins.outputs.bun }}

      - name: Refuse a different runtime version
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: scripts/tool-versions.sh check "$RUNTIME"

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Sign-then-verify lane
        env:
          BAP_RUNTIMES: ${{ matrix.runtime }}
        run: pnpm test:runtimes

  package:
    timeout-minutes: 5 # Run 44312139445: green job 39s.
    # The packed tarball as a consumer receives it: typecheck with skipLibCheck false under each
    # resolution, lib and condition set, the leaked-type red-proof, the installed package run on
    # Node (both verifier backends), Deno and Bun, and the closed deep-import surface probed on
    # each runtime (every dist path refuses).
    name: packed tarball (consumer typecheck and runtimes)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read exact runtime pins
        id: pins
        shell: bash
        run: scripts/tool-versions.sh read nodejs deno bun

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.nodejs }}
          package-manager-cache: false
      - name: Activate the declared pnpm with Corepack
        run: |
          manager="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')"
          case "$manager" in pnpm@[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::Declare an exact pnpm packageManager"; exit 1 ;; esac
          corepack enable
          corepack prepare "$manager" --activate
          version="$(pnpm --version)"
          test "pnpm@$version" = "$manager"
      - name: Refuse a different Node version
        run: scripts/tool-versions.sh check nodejs

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ steps.pins.outputs.deno }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.pins.outputs.bun }}

      - name: Refuse different runtime versions
        run: |
          scripts/tool-versions.sh check deno
          scripts/tool-versions.sh check bun

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Packed tarball and every Node documentation journey (packed candidate; builds first)
        run: pnpm test:tarball

  browser:
    timeout-minutes: 5 # Run 44312139445: slowest green lane 89s.
    # Real engines through Playwright under the strict CSP (an engine axis, not an OS axis: Linux only).
    # Each engine also runs the WebCrypto key-handle battery with its own keys (including a same-origin
    # iframe key) and the non-secure-context lane (http://bap.test routed by Playwright). Linux WebKit is
    # evidence for the pure-JS code and for that WebKit build's WebCrypto only, never for Safari.
    name: browser lane on ${{ matrix.engine }}
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --init --ipc=host
    env:
      HOME: /root # Firefox requires the current user's home in a root container.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read exact runtime pins
        id: pins
        shell: bash
        run: scripts/tool-versions.sh read nodejs

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.nodejs }}
          package-manager-cache: false
      - name: Activate the declared pnpm with Corepack
        run: |
          manager="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')"
          case "$manager" in pnpm@[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::Declare an exact pnpm packageManager"; exit 1 ;; esac
          corepack enable
          corepack prepare "$manager" --activate
          version="$(pnpm --version)"
          test "pnpm@$version" = "$manager"
      - name: Refuse a different Node version
        run: scripts/tool-versions.sh check nodejs

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Refuse a different Playwright version
        run: |
          expected="1.65.1"
          actual="$(node -p 'require("playwright/package.json").version')"
          test "$actual" = "$expected" || { echo "::error::Installed Playwright $actual differs from container image Playwright $expected; update the lockfile and image together"; exit 1; }

      - name: Build the public playground and candidate package
        run: |
          pnpm build
          pnpm typecheck:web
          pnpm build:site

      - name: Built playground and browser documentation (packed candidate)
        env:
          BAP_BROWSERS: ${{ matrix.engine }}
        run: pnpm test:playground

      - name: Browser lane
        env:
          BAP_BROWSERS: ${{ matrix.engine }}
        run: pnpm test:browser

  supply-chain:
    timeout-minutes: 5 # Run 44122886989: slowest green lane 24s.
    # Registry signatures and provenance attestations of every installed package (CI and release).
    name: npm audit signatures
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read exact runtime pins
        id: pins
        shell: bash
        run: scripts/tool-versions.sh read nodejs

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.nodejs }}
          package-manager-cache: false
      - name: Activate the declared pnpm with Corepack
        run: |
          manager="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')"
          case "$manager" in pnpm@[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::Declare an exact pnpm packageManager"; exit 1 ;; esac
          corepack enable
          corepack prepare "$manager" --activate
          version="$(pnpm --version)"
          test "pnpm@$version" = "$manager"
      - name: Refuse a different Node version
        run: scripts/tool-versions.sh check nodejs

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Audit dependency advisories
        run: pnpm audit --audit-level=high

      - name: Verify registry signatures and attestations
        run: npm audit signatures

  dependency-currency:
    timeout-minutes: 5 # Run 44122886989: slowest green lane 26s.
    # Latest-first dependency currency (the protocol family's shape). A property of the
    # manifest + lockfile, so it is proven once per run, not once per OS lane.
    name: dependency currency (latest-first)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read exact runtime pins
        id: pins
        shell: bash
        run: scripts/tool-versions.sh read nodejs

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.nodejs }}
          package-manager-cache: false
      - name: Activate the declared pnpm with Corepack
        run: |
          manager="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')"
          case "$manager" in pnpm@[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::Declare an exact pnpm packageManager"; exit 1 ;; esac
          corepack enable
          corepack prepare "$manager" --activate
          version="$(pnpm --version)"
          test "pnpm@$version" = "$manager"
      - name: Refuse a different Node version
        run: scripts/tool-versions.sh check nodejs

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Dependency currency (classified exit; unverified never passes)
        run: node tools/check-currency.mjs

  site:
    timeout-minutes: 5 # Pages run 44657967286: green build job 27s.
    # Qualify the complete Pages pipeline from a frozen install, before any library build.
    name: Pages build and checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read exact runtime pins
        id: pins
        shell: bash
        run: scripts/tool-versions.sh read nodejs

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.nodejs }}
          package-manager-cache: false
      - name: Activate the declared pnpm with Corepack
        run: |
          manager="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')"
          case "$manager" in pnpm@[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::Declare an exact pnpm packageManager"; exit 1 ;; esac
          corepack enable
          corepack prepare "$manager" --activate
          version="$(pnpm --version)"
          test "pnpm@$version" = "$manager"
      - name: Refuse a different Node version
        run: scripts/tool-versions.sh check nodejs

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build and check the complete Pages site
        run: pnpm site

  notebooks-local:
    timeout-minutes: 5 # Run 44312139445: green job 36s.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact notebook toolchain and frozen dependencies
        uses: ./.github/actions/notebook-tools
      # deno fmt --check misreports notebooks on a cold cache; compare the formatted bytes.
      - name: Refuse unformatted notebook cells
        run: |
          deno fmt docs/notebooks/*.ipynb
          git diff --exit-code -- docs/notebooks
      - name: Execute notebooks against the inspected packed candidate
        run: pnpm notebooks:local

  qualified:
    if: always()
    needs: [verify, runtimes, package, browser, supply-chain, dependency-currency, site, notebooks-local]
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # Run 44312139445: green job 6s.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read exact Python pin
        id: pins
        run: scripts/tool-versions.sh read python
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.pins.outputs.python }}
      - name: Refuse a different Python version
        run: scripts/tool-versions.sh check python
      - name: Require every qualification job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['NEEDS_JSON'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if failed:
              raise SystemExit(f'Qualification failed: {failed}')
          PYTHON
