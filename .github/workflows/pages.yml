# GitHub Pages serves the envelope playground and versioned API reference. Static bundle built from this
# repository's development signer source plus the published verifier package; no backend,
# no secrets, deploy-only permissions.
name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    environment: github-pages
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    timeout-minutes: 5 # Run 44010185868: green build job 35s.
    name: Build the playground and API reference
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse a ref outside the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" || { echo "::error::Publication requires the default branch"; exit 1; }
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read exact runtime pins
        id: pins
        run: scripts/tool-versions.sh read nodejs
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.nodejs }}
          package-manager-cache: false
      - name: Activate the declared pnpm with Corepack
        run: |
          manager="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')"
          case "$manager" in pnpm@[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::Declare an exact pnpm packageManager"; exit 1 ;; esac
          corepack enable
          corepack prepare "$manager" --activate
          test "pnpm@$(pnpm --version)" = "$manager"
      - name: Refuse a different Node version
        run: scripts/tool-versions.sh check nodejs

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck the site
        run: pnpm typecheck:web

      - name: Build the bundle
        run: pnpm build:site

      # The bundle is built with no node:crypto shim and no Buffer polyfill (the verifier resolves its
      # portable backend for the browser); a free Node global anywhere in it fails the deploy.
      - name: Browser guard over the bundle (no unresolved globals, eval or Function constructor)
        run: pnpm guard:site

      - name: Build /api/ from the release tag matching npm latest
        run: pnpm docs:api:release

      - name: Every built-site version claim must match npm latest
        run: pnpm check:site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@0252fc4ba7626f0298f0cf00902a25c6afc77fa8 # v3.0.0
        with:
          path: site-dist

  deploy:
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    timeout-minutes: 5 # Run 44010185868: green deploy job 11s.
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse a ref outside the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" || { echo "::error::Publication requires the default branch"; exit 1; }
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@7a9bd943aa5e5175aeb8502edcc6c1c02d398e10 # v4.0.2
